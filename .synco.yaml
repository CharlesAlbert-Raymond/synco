# Synco local config for this repo.
# Overrides ~/.config/synco/config.yaml

worktree_dir: ".worktrees"
sidebar_width: "28"
project_name: "synco"
on_create: ""
on_destroy: ""
auto_delete_branch: true

default_creation_profile: dev

creation_profiles:
  inspect:
    create_session: true
    run_on_create: false

theme:
  pane_border: "#3a3a3a"
  pane_border_active: "#7aa2f7"
  pane_border_labels: true

notifications:
  enabled: true
  silence_seconds: 10
  bell: false
  system_notification: false
  sound: "Glass"

layouts:
  default:
    panes:
      - command: ""
