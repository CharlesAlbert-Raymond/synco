# Synco local config for this repo.
# Overrides ~/.config/synco/config.yaml

worktree_dir: ".worktrees"
sidebar_width: "28"
project_name: "synco"
on_create: ""
on_destroy: ""
auto_delete_branch: true

scripts:
  copy_ignored_files:
    path: .synco/scripts/copy_ignored_files.sh

default_creation_profile: dev

creation_profiles:
  dev:
    create_session: true
    run_on_create: true

  inspect:
    create_session: true
    run_on_create: false

  qa:
    create_session: false
    run_on_create: false
    scripts:
      after_create:
        - copy_ignored_files

theme:
  pane_border: "#3a3a3a"
  pane_border_active: "#7aa2f7"
  pane_border_labels: true

notifications:
  enabled: true
  silence_seconds: 10
  bell: false
  system_notification: false
  sound: "Glass"

layouts:
  default:
    panes:
      - command: ""
